<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e2f5e9"/>
    </linearGradient>
    <linearGradient id="foodBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="foodShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="1200" height="675" fill="url(#foodBg)"/>
  <circle cx="1100" cy="120" r="280" fill="#16a34a" opacity="0.08" filter="blur(60px)"/>
  <circle cx="140" cy="530" r="240" fill="#2563eb" opacity="0.07" filter="blur(50px)"/>

  <!-- Desktop Monitor Frame -->
  <g filter="url(#foodShadow)">
    <rect x="70" y="45" width="1060" height="585" rx="16" fill="#0f172a"/>
    <rect x="76" y="51" width="1048" height="573" rx="12" fill="#ffffff"/>

    <!-- Browser Tab Bar -->
    <rect x="76" y="51" width="1048" height="42" rx="12" fill="#f8fafc"/>
    <circle cx="102" cy="72" r="5.5" fill="#ef4444"/>
    <circle cx="120" cy="72" r="5.5" fill="#f59e0b"/>
    <circle cx="138" cy="72" r="5.5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="180" y="60" width="480" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="200" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#475569">https://freshfarm-organic.vn — Siêu Thị Nông Sản Hữu Cơ Tươi Sạch</text>

    <!-- WEBSITE UI INSIDE -->
    <!-- Store Header -->
    <rect x="76" y="93" width="1048" height="60" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
    <text x="105" y="130" font-family="sans-serif" font-size="22" font-weight="900" fill="#15803d">FRESH<tspan fill="#16a34a">FARM</tspan> <tspan font-size="12" fill="#64748b" font-weight="normal">| ORGANIC MART</tspan></text>
    
    <text x="540" y="128" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534">⚡ Giao Nhanh 2H</text>
    <text x="660" y="128" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">RAU HỮU CƠ</text>
    <text x="765" y="128" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">TRÁI CÂY NHẬP</text>

    <!-- Cart Button -->
    <rect x="940" y="106" width="155" height="34" rx="8" fill="url(#foodBtn)"/>
    <text x="965" y="128" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">GIỎ HÀNG (3 MÓN)</text>

    <!-- Main Content -->
    <g transform="translate(105, 175)">
      <!-- Left Hero Promo Banner -->
      <rect x="0" y="0" width="620" height="420" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      
      <!-- Visual Display of Fruit & Veggie Basket -->
      <rect x="20" y="20" width="580" height="220" rx="8" fill="#dcfce7"/>
      <!-- Fruit stylized illustrations -->
      <circle cx="180" cy="130" r="55" fill="#ef4444"/>
      <circle cx="280" cy="115" r="70" fill="#f97316"/>
      <circle cx="390" cy="135" r="50" fill="#22c55e"/>
      <circle cx="480" cy="130" r="45" fill="#eab308"/>

      <rect x="35" y="35" width="170" height="24" rx="4" fill="#ffffff" opacity="0.95"/>
      <text x="45" y="51" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">CHỨNG NHẬN VIETGAP &amp; USDA</text>

      <text x="25" y="275" font-family="sans-serif" font-size="24" font-weight="extrabold" fill="#0f172a">Hộp Quà Trái Cây Hữu Cơ Thu Hoạch Trong Ngày</text>
      <text x="25" y="305" font-family="sans-serif" font-size="12" fill="#166534">
        100% nông sản sạch từ nông trại cao nguyên Đà Lạt. Đóng gói hộp quà sang trọng, giao tận nhà trong 2 giờ.
      </text>

      <!-- Price & Deal -->
      <text x="25" y="345" font-family="sans-serif" font-size="22" font-weight="extrabold" fill="#dc2626">580.000 đ <tspan font-size="13" font-weight="normal" text-decoration="line-through" fill="#94a3b8">750.000 đ</tspan></text>
      <text x="220" y="343" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">Tiết kiệm 23% hôm nay</text>

      <rect x="25" y="365" width="180" height="38" rx="8" fill="#2563eb"/>
      <text x="50" y="389" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">ĐẶT GIAO HỎA TỐC</text>

      <!-- Right Column: Product Cards & Order fast form -->
      <g transform="translate(645, 0)">
        <!-- Item 1 -->
        <rect x="0" y="0" width="345" height="125" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="15" y="15" width="95" height="95" rx="8" fill="#fee2e2"/>
        <circle cx="62" cy="62" r="32" fill="#ef4444"/>
        <text x="125" y="40" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Dâu Tây Giống Nhật Đà Lạt</text>
        <text x="125" y="62" font-family="sans-serif" font-size="11" fill="#64748b">Hộp 500g • Vừa hái sáng nay</text>
        <text x="125" y="88" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">195.000 đ</text>
        <rect x="250" y="70" width="80" height="28" rx="6" fill="#2563eb"/>
        <text x="263" y="88" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">+ Chọn</text>

        <!-- Item 2 -->
        <g transform="translate(0, 140)">
          <rect x="0" y="0" width="345" height="125" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <rect x="15" y="15" width="95" height="95" rx="8" fill="#fef3c7"/>
          <circle cx="62" cy="62" r="32" fill="#f59e0b"/>
          <text x="125" y="40" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Cam Sành Hữu Cơ Miền Tây</text>
          <text x="125" y="62" font-family="sans-serif" font-size="11" fill="#64748b">Túi 2kg mọng nước</text>
          <text x="125" y="88" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">120.000 đ</text>
          <rect x="250" y="70" width="80" height="28" rx="6" fill="#2563eb"/>
          <text x="263" y="88" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">+ Chọn</text>
        </g>

        <!-- Trust Note -->
        <g transform="translate(0, 280)">
          <rect x="0" y="0" width="345" height="140" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
          <text x="20" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">CHÍNH SÁCH BẢO VỆ NGƯỜI DÙNG</text>
          <text x="20" y="58" font-family="sans-serif" font-size="11" fill="#166534">• Đổi trả 1-1 trong 24h nếu dập nát</text>
          <text x="20" y="80" font-family="sans-serif" font-size="11" fill="#166534">• Miễn phí vận chuyển cho đơn từ 500k</text>
          <text x="20" y="102" font-family="sans-serif" font-size="11" fill="#166534">• Kiểm tra hàng trước khi thanh toán</text>
        </g>
      </g>
    </g>
  </g>
</svg>
