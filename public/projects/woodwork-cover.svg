<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="woodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfbf7"/>
    </linearGradient>
    <linearGradient id="warmWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#woodBg)"/>
  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Browser Frame -->
  <rect x="60" y="40" width="1080" height="595" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="60" y="40" width="1080" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="85" cy="61" r="5" fill="#f87171"/>
  <circle cx="103" cy="61" r="5" fill="#fbbf24"/>
  <circle cx="121" cy="61" r="5" fill="#34d399"/>
  <rect x="160" y="50" width="480" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="65" font-family="sans-serif" font-size="11" fill="#64748b">https://mocgiaphat.com.vn — Xưởng Mộc &amp; Nội Thất Gỗ Tự Nhiên</text>

  <!-- Web Header inside frame -->
  <rect x="60" y="82" width="1080" height="55" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
  <text x="90" y="117" font-family="'Georgia', serif" font-size="20" font-weight="bold" fill="#713f12">MỘC GIA PHÁT <tspan font-size="12" fill="#92400e" font-family="sans-serif">| XƯỞNG MỘC TRỰC TIẾP</tspan></text>
  <text x="650" y="115" font-family="sans-serif" font-size="13" fill="#334155">Trang chủ</text>
  <text x="740" y="115" font-family="sans-serif" font-size="13" fill="#334155">Sản phẩm gỗ</text>
  <text x="850" y="115" font-family="sans-serif" font-size="13" fill="#334155">Hình ảnh xưởng</text>
  <rect x="970" y="94" width="140" height="32" rx="6" fill="#854d0e"/>
  <text x="988" y="115" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Nhận Báo Giá Mộc</text>

  <!-- Hero Content inside web mockup -->
  <g transform="translate(90, 160)">
    <!-- Left Hero Banner -->
    <rect x="0" y="0" width="620" height="340" rx="10" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
    
    <!-- Warm wood illustration -->
    <rect x="30" y="30" width="560" height="180" rx="8" fill="#f5ebe0" stroke="#d5bdaf" stroke-width="1"/>
    <!-- Stylized Furniture Silhouette -->
    <rect x="80" y="90" width="220" height="80" rx="4" fill="#a2673d"/>
    <rect x="90" y="80" width="200" height="20" rx="2" fill="#784421"/>
    <rect x="330" y="60" width="180" height="110" rx="4" fill="#8a532d"/>
    <rect x="345" y="75" width="70" height="80" rx="2" fill="#b07d57"/>
    <rect x="425" y="75" width="70" height="80" rx="2" fill="#b07d57"/>

    <text x="30" y="245" font-family="'Georgia', serif" font-size="22" font-weight="bold" fill="#451a03">Chuyên Sản Xuất Nội Thất Gỗ Gõ Đỏ, Óc Chó, Sồi</text>
    <text x="30" y="275" font-family="sans-serif" font-size="13" fill="#78350f">Gia công trực tiếp tại xưởng 1.500m2 • Không qua trung gian • Cam kết đúng chủng loại gỗ 100%</text>
    <rect x="30" y="295" width="160" height="30" rx="4" fill="#92400e"/>
    <text x="45" y="315" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Xem mẫu tủ &amp; bàn ăn</text>
    
    <!-- Right side: Workshop highlights -->
    <g transform="translate(640, 0)">
      <rect x="0" y="0" width="380" height="160" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Ảnh thực tế tại xưởng chế tác</text>
      <!-- Simulated workshop thumbnail -->
      <rect x="20" y="45" width="340" height="95" rx="6" fill="#e2e8f0"/>
      <text x="110" y="100" font-family="sans-serif" font-size="12" fill="#64748b">Dàn máy cưa mộng CNC &amp; xưởng sơn PU</text>

      <!-- Quotation Form Preview -->
      <rect x="0" y="180" width="380" height="160" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Nhận bản vẽ &amp; dự toán báo giá</text>
      <rect x="20" y="225" width="340" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="30" y="243" font-family="sans-serif" font-size="11" fill="#94a3b8">Nhập số điện thoại để thợ liên hệ tư vấn...</text>
      <rect x="20" y="260" width="340" height="35" rx="4" fill="#047857"/>
      <text x="95" y="282" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Gửi Yêu Cầu Khảo Sát Tận Nhà</text>
      <text x="20" y="315" font-family="sans-serif" font-size="10" fill="#64748b">* Miễn phí 100% bản vẽ thiết kế khi thi công trọn gói</text>
    </g>
  </g>

  <!-- Mobile Preview Frame overlay at bottom right -->
  <g transform="translate(920, 360)">
    <rect x="0" y="0" width="160" height="260" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <rect x="50" y="8" width="60" height="8" rx="4" fill="#0f172a"/>
    <text x="15" y="45" font-family="'Georgia', serif" font-size="11" font-weight="bold" fill="#713f12">Mộc Gia Phát</text>
    <rect x="15" y="55" width="130" height="60" rx="4" fill="#fef3c7"/>
    <text x="25" y="80" font-family="sans-serif" font-size="9" font-weight="bold" fill="#92400e">Gỗ Tự Nhiên</text>
    <text x="25" y="95" font-family="sans-serif" font-size="8" fill="#78350f">Xuất xứ rõ ràng</text>
    <rect x="15" y="125" width="130" height="35" rx="4" fill="#f1f5f9"/>
    <text x="20" y="145" font-family="sans-serif" font-size="9" fill="#334155">Bộ bàn ghế phòng khách</text>
    <rect x="15" y="170" width="130" height="26" rx="4" fill="#854d0e"/>
    <text x="35" y="187" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Gọi thợ mộc</text>
  </g>
</svg>
