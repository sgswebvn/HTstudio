<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#0b1329"/>
  <text x="80" y="80" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f59e0b">PULSE — Zero-CLS AdSense &amp; 5 Legal Policies</text>
  <text x="80" y="115" font-family="sans-serif" font-size="16" fill="#94a3b8">Bố cục quảng cáo không xô lệch giao diện và trọn bộ chính sách pháp lý Mỹ</text>

  <!-- Left: Layout wireframe showing fixed ad slots -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="500" height="440" rx="10" fill="#131c31" stroke="#223354" stroke-width="1"/>
    <text x="24" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Cấu trúc Vị trí Quảng cáo Cố định Kích thước</text>

    <!-- Leaderboard Ad Slot -->
    <rect x="24" y="60" width="452" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="140" y="96" font-family="sans-serif" font-size="12" fill="#f59e0b" font-weight="bold">LEADERBOARD (728x90 Aspect Ratio Slot)</text>

    <!-- Main Content & Sidebar -->
    <rect x="24" y="140" width="280" height="270" rx="6" fill="#1e293b"/>
    <text x="40" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Nội dung bài viết</text>
    <line x1="40" y1="190" x2="280" y2="190" stroke="#334155" stroke-width="2"/>
    <line x1="40" y1="210" x2="280" y2="210" stroke="#334155" stroke-width="2"/>
    
    <!-- In-article Ad -->
    <rect x="40" y="230" width="248" height="70" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="75" y="270" font-family="sans-serif" font-size="11" fill="#f59e0b">In-Article Ad (300x250 Fixed)</text>

    <line x1="40" y1="320" x2="280" y2="320" stroke="#334155" stroke-width="2"/>
    <line x1="40" y1="340" x2="250" y2="340" stroke="#334155" stroke-width="2"/>

    <!-- Sticky Sidebar -->
    <rect x="320" y="140" width="156" height="270" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="335" y="270" font-family="sans-serif" font-size="11" fill="#f59e0b" font-weight="bold">STICKY SIDEBAR</text>
    <text x="345" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">(300x600 px)</text>
  </g>

  <!-- Right: 5 Legal Compliance Pages -->
  <g transform="translate(620, 160)">
    <rect x="0" y="0" width="500" height="440" rx="10" fill="#131c31" stroke="#223354" stroke-width="1"/>
    <text x="24" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">5 Trang Pháp Lý Bắt Buộc Chuẩn AdSense &amp; E-E-A-T</text>

    <g transform="translate(24, 70)">
      <rect x="0" y="0" width="452" height="55" rx="6" fill="#1e293b"/>
      <text x="20" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">1. /about</text>
      <text x="20" y="44" font-family="sans-serif" font-size="12" fill="#cbd5e1">Ban biên tập, Masthead, Fact-checking &amp; E-E-A-T Policy</text>

      <rect x="0" y="68" width="452" height="55" rx="6" fill="#1e293b"/>
      <text x="20" y="94" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">2. /contact</text>
      <text x="20" y="112" font-family="sans-serif" font-size="12" fill="#cbd5e1">Biểu mẫu liên hệ, tòa soạn tại Mỹ (Los Angeles &amp; New York)</text>

      <rect x="0" y="136" width="452" height="55" rx="6" fill="#1e293b"/>
      <text x="20" y="162" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">3. /privacy-policy</text>
      <text x="20" y="180" font-family="sans-serif" font-size="12" fill="#cbd5e1">Chính sách Cookie DoubleClick DART, CCPA/CPRA (California), COPPA</text>

      <rect x="0" y="204" width="452" height="55" rx="6" fill="#1e293b"/>
      <text x="20" y="230" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">4. /terms-of-service</text>
      <text x="20" y="248" font-family="sans-serif" font-size="12" fill="#cbd5e1">Điều khoản dịch vụ, cơ chế giải quyết tranh chấp bản quyền DMCA</text>

      <rect x="0" y="272" width="452" height="55" rx="6" fill="#1e293b"/>
      <text x="20" y="298" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">5. /disclaimer</text>
      <text x="20" y="316" font-family="sans-serif" font-size="12" fill="#cbd5e1">Tuyên bố miễn trừ trách nhiệm &amp; Fair Use (17 U.S. Code § 107)</text>

      <rect x="0" y="340" width="452" height="30" rx="4" fill="#042f2e"/>
      <text x="20" y="360" font-family="sans-serif" font-size="12" fill="#2dd4bf" font-weight="bold">✓ Tệp public/ads.txt chuẩn hóa sẵn sàng cho nhà xuất bản</text>
    </g>
  </g>
</svg>
