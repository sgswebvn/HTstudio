<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#090d16"/>
  
  <text x="80" y="70" font-family="sans-serif" font-size="28" font-weight="bold" fill="#38bdf8">ProductHub — REST API v1 &amp; Key Authentication</text>
  <text x="80" y="105" font-family="sans-serif" font-size="15" fill="#94a3b8">Bảo vệ nguồn tài nguyên dữ liệu sản phẩm dùng chung bằng Hashed API Key</text>

  <g transform="translate(80, 140)">
    <!-- Request Flow Box -->
    <rect x="0" y="0" width="1040" height="230" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <!-- Step 1: External Client -->
    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="220" height="150" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="20" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">1. External Client</text>
      <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Web Bán Hàng / App</text>
      <rect x="15" y="85" width="190" height="45" rx="4" fill="#020617"/>
      <text x="24" y="105" font-family="monospace" font-size="10" fill="#38bdf8">Header: x-api-key</text>
      <text x="24" y="122" font-family="monospace" font-size="10" fill="#a78bfa">Bearer ph_live_...</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 280,115 L 370,115" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="370,115 360,110 360,120" fill="#38bdf8"/>

    <!-- Step 2: API Gateway & Auth Guard -->
    <g transform="translate(390, 40)">
      <rect x="0" y="0" width="260" height="150" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
      <text x="20" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">2. Auth Guard &amp; Rate Limit</text>
      <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#cbd5e1">Băm SHA-256 khóa API</text>
      <text x="20" y="90" font-family="sans-serif" font-size="12" fill="#cbd5e1">Đối chiếu Hashed Key trong DB</text>
      <rect x="15" y="105" width="230" height="30" rx="4" fill="#064e3b"/>
      <text x="25" y="125" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">✓ 200 OK — Quyền hạn hợp lệ</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 670,115 L 760,115" stroke="#10b981" stroke-width="3"/>
    <polygon points="760,115 750,110 750,120" fill="#10b981"/>

    <!-- Step 3: Product Data Service -->
    <g transform="translate(780, 40)">
      <rect x="0" y="0" width="220" height="150" rx="8" fill="#0f172a" stroke="#059669" stroke-width="2"/>
      <text x="20" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399">3. Product Catalog</text>
      <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#cbd5e1">MongoDB Atlas</text>
      <text x="20" y="90" font-family="sans-serif" font-size="12" fill="#94a3b8">Trả JSON phân trang</text>
      <text x="20" y="125" font-family="monospace" font-size="11" fill="#6ee7b7">{ data, pagination }</text>
    </g>
  </g>

  <!-- Code Snippet Box -->
  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="1040" height="190" rx="10" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="30" y="35" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Đặc tả Endpoint /api/v1/products:</text>

    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="980" height="110" rx="6" fill="#020617"/>
      <text x="20" y="30" font-family="monospace" font-size="12" fill="#38bdf8">GET /api/v1/products?category=electronics&amp;limit=20&amp;fields=name,sku,price,attributes</text>
      <text x="20" y="60" font-family="monospace" font-size="12" fill="#a78bfa">Response 200 OK: Content-Type: application/json; Cache-Control: s-maxage=60, stale-while-revalidate</text>
      <text x="20" y="90" font-family="monospace" font-size="12" fill="#10b981">// Tối ưu truy vấn với MongoDB index compound: { status: 1, categoryId: 1, updatedAt: -1 }</text>
    </g>
  </g>
</svg>
