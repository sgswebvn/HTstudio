<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#090d16"/>
  
  <text x="80" y="70" font-family="sans-serif" font-size="28" font-weight="bold" fill="#a78bfa">ProductHub — Module Registry &amp; Lifecycle</text>
  <text x="80" y="105" font-family="sans-serif" font-size="15" fill="#94a3b8">Cơ chế quản lý trạng thái module: Bật/tắt an toàn, dữ liệu không bao giờ bị xóa</text>

  <g transform="translate(80, 150)">
    <!-- Lifecycle Diagram Box -->
    <rect x="0" y="0" width="1040" height="220" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- State 1: ENABLED -->
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="260" height="130" rx="8" fill="#064e3b" stroke="#059669" stroke-width="2"/>
      <text x="24" y="38" font-family="sans-serif" font-size="18" font-weight="bold" fill="#34d399">TRẠNG THÁI: ENABLED</text>
      <text x="24" y="70" font-family="sans-serif" font-size="12" fill="#a7f3d0">• Routes API hoạt động bình thường</text>
      <text x="24" y="95" font-family="sans-serif" font-size="12" fill="#a7f3d0">• Hook &amp; Services cung cấp đầy đủ</text>
      <text x="24" y="118" font-family="sans-serif" font-size="12" fill="#a7f3d0">• Dữ liệu đọc/ghi trực tiếp</text>
    </g>

    <!-- Transition Arrows -->
    <g transform="translate(360, 75)">
      <!-- disable() -->
      <path d="M 0,15 L 240,15" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 3"/>
      <polygon points="240,15 230,10 230,20" fill="#ef4444"/>
      <text x="120" y="5" font-family="monospace" font-size="13" font-weight="bold" fill="#f87171" text-anchor="middle">disable()</text>

      <!-- enable() -->
      <path d="M 240,50 L 0,50" stroke="#10b981" stroke-width="3"/>
      <polygon points="0,50 10,45 10,55" fill="#10b981"/>
      <text x="120" y="75" font-family="monospace" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">enable()</text>
    </g>

    <!-- State 2: DISABLED -->
    <g transform="translate(680, 40)">
      <rect x="0" y="0" width="280" height="130" rx="8" fill="#450a0a" stroke="#b91c1c" stroke-width="2"/>
      <text x="24" y="38" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fca5a5">TRẠNG THÁI: DISABLED</text>
      <text x="24" y="70" font-family="sans-serif" font-size="12" fill="#fecaca">• Routes trả HTTP 403 / 404 an toàn</text>
      <text x="24" y="95" font-family="sans-serif" font-size="12" fill="#fecaca">• Dữ liệu cũ KHÔNG bị xóa!</text>
      <text x="24" y="118" font-family="sans-serif" font-size="12" fill="#34d399">• Re-enable phục hồi nguyên vẹn</text>
    </g>
  </g>

  <!-- Module Registry Manifest Details -->
  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="1040" height="190" rx="10" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="30" y="35" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Cấu trúc ModuleManifest (TypeScript Type-Safe):</text>
    
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="980" height="110" rx="6" fill="#020617"/>
      <text x="20" y="30" font-family="monospace" font-size="12" fill="#a78bfa">interface ModuleManifest {</text>
      <text x="40" y="55" font-family="monospace" font-size="12" fill="#cbd5e1">id: string;  name: string;  version: string;  dependencies: string[];</text>
      <text x="40" y="80" font-family="monospace" font-size="12" fill="#38bdf8">isCore: boolean; // Core modules (identity, products, categories) không thể disable</text>
      <text x="20" y="102" font-family="monospace" font-size="12" fill="#a78bfa">}</text>
    </g>
  </g>
</svg>
