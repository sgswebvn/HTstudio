<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <circle cx="1050" cy="120" r="280" fill="#3b82f6" opacity="0.08" filter="blur(60px)"/>
  <circle cx="150" cy="500" r="240" fill="#0ea5e9" opacity="0.07" filter="blur(50px)"/>

  <!-- Desktop Monitor Frame -->
  <g filter="url(#cardShadow)">
    <!-- Monitor Bezel -->
    <rect x="70" y="45" width="1060" height="585" rx="16" fill="#0f172a"/>
    <rect x="76" y="51" width="1048" height="573" rx="12" fill="#ffffff"/>

    <!-- Browser Tab Bar -->
    <rect x="76" y="51" width="1048" height="42" rx="12" fill="#f1f5f9"/>
    <circle cx="102" cy="72" r="5.5" fill="#ef4444"/>
    <circle cx="120" cy="72" r="5.5" fill="#f59e0b"/>
    <circle cx="138" cy="72" r="5.5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="180" y="60" width="460" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="200" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#475569">https://pulse-entertainment.vn — Tạp Chí Tin Tức &amp; Giải Trí Quốc Tế</text>

    <!-- WEBSITE UI INSIDE -->
    <!-- News Header -->
    <rect x="76" y="93" width="1048" height="58" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
    <text x="105" y="129" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" letter-spacing="1" fill="#0f172a">PULSE <tspan fill="#2563eb">MAGAZINE</tspan></text>
    
    <text x="560" y="127" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">ĐIỆN ẢNH</text>
    <text x="640" y="127" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">ÂM NHẠC</text>
    <text x="715" y="127" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">THỜI TRANG</text>
    <text x="805" y="127" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">CÔNG NGHỆ</text>

    <rect x="940" y="106" width="150" height="32" rx="6" fill="url(#blueAccent)"/>
    <text x="965" y="127" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">ĐĂNG KÝ BẢN TIN</text>

    <!-- Breaking News Ticker -->
    <rect x="76" y="151" width="1048" height="26" fill="#0f172a"/>
    <rect x="105" y="155" width="85" height="18" rx="3" fill="#dc2626"/>
    <text x="115" y="168" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">TIN NÓNG 24/7</text>
    <text x="205" y="168" font-family="sans-serif" font-size="11" fill="#cbd5e1">Liên hoan phim Venice công bố giải thưởng Sư Tử Vàng 2026 • Kỷ lục lượt xem bom tấn mới...</text>

    <!-- Content Grid -->
    <g transform="translate(105, 190)">
      <!-- Main Featured Story (Left 620px) -->
      <rect x="0" y="0" width="620" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Photo Area -->
      <rect x="15" y="15" width="590" height="240" rx="8" fill="#1e293b"/>
      <!-- Graphic Elements simulating movie still -->
      <circle cx="310" cy="115" r="55" fill="#3b82f6" opacity="0.4"/>
      <path d="M15 170 Q 200 120 400 190 T 605 160 L 605 255 L 15 255 Z" fill="#0f172a" opacity="0.8"/>
      <rect x="35" y="35" width="90" height="22" rx="4" fill="#2563eb"/>
      <text x="45" y="50" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">TIÊU ĐIỂM SỐ</text>
      
      <text x="35" y="290" font-family="'Georgia', serif" font-size="22" font-weight="bold" fill="#0f172a">Kỷ Nguyên Mới Của Điện Ảnh Kỹ Thuật Số Chuẩn IMAX</text>
      <text x="35" y="320" font-family="sans-serif" font-size="12" fill="#475569" width="550">
        Phân tích chuyên sâu về công nghệ quay thực tế ảo, hệ thống âm thanh vòm và trải nghiệm màn ảnh rộng thế hệ tiếp theo...
      </text>
      
      <text x="35" y="355" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Bởi Ban Biên Tập PULSE • 15 phút trước • 12.8k lượt xem</text>

      <!-- Right Column: 3 Trending Stories (380px) -->
      <g transform="translate(640, 0)">
        <!-- Story 1 -->
        <rect x="0" y="0" width="350" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="12" y="12" width="110" height="96" rx="6" fill="#334155"/>
        <text x="135" y="35" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">ÂM NHẠC QUỐC TẾ</text>
        <text x="135" y="58" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Album mới phá vỡ mọi</text>
        <text x="135" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">kỷ lục phát trực tuyến 2026</text>
        <text x="135" y="98" font-family="sans-serif" font-size="10" fill="#64748b">45 phút trước</text>

        <!-- Story 2 -->
        <g transform="translate(0, 135)">
          <rect x="0" y="0" width="350" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <rect x="12" y="12" width="110" height="96" rx="6" fill="#1e3a8a"/>
          <text x="135" y="35" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2563eb">CÔNG NGHỆ MEDIA</text>
          <text x="135" y="58" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Trí tuệ nhân tạo tái tạo</text>
          <text x="135" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">chất lượng phim nhựa 4K</text>
          <text x="135" y="98" font-family="sans-serif" font-size="10" fill="#64748b">2 giờ trước</text>
        </g>

        <!-- Story 3: Clean Ad / Stats Box -->
        <g transform="translate(0, 270)">
          <rect x="0" y="0" width="350" height="130" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
          <text x="20" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">TỐI ƯU HIỆU NĂNG TỐC ĐỘ CAO</text>
          <text x="20" y="55" font-family="sans-serif" font-size="11" fill="#1d4ed8">Zero CLS (Không giật khung hình khi tải tin tức)</text>
          <text x="20" y="75" font-family="sans-serif" font-size="11" fill="#1d4ed8">Tốc độ mở bài viết: 0.8 giây</text>
          <rect x="20" y="90" width="180" height="26" rx="4" fill="#2563eb"/>
          <text x="35" y="107" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">ĐỌC BÀI VIẾT GỐC →</text>
        </g>
      </g>
    </g>
  </g>
</svg>
