<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#fcfbf7"/>
  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Browser Frame -->
  <rect x="60" y="40" width="1080" height="595" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="60" y="40" width="1080" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="85" cy="61" r="5" fill="#f87171"/>
  <circle cx="103" cy="61" r="5" fill="#fbbf24"/>
  <circle cx="121" cy="61" r="5" fill="#34d399"/>
  <rect x="160" y="50" width="480" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="65" font-family="sans-serif" font-size="11" fill="#64748b">https://freshfarm.vn/hop-qua-trai-cay-sach — Landing Page Đặt Mua</text>

  <!-- Top bar -->
  <rect x="60" y="82" width="1080" height="55" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
  <text x="90" y="117" font-family="sans-serif" font-size="18" font-weight="extrabold" fill="#15803d">FRESHFARM <tspan font-size="12" fill="#166534">ORGANIC</tspan></text>
  <text x="720" y="115" font-family="sans-serif" font-size="12" fill="#16a34a" font-weight="bold">⚡ Giao Hỏa Tốc 2 Giờ Nội Thành</text>
  <rect x="970" y="94" width="140" height="32" rx="6" fill="#15803d"/>
  <text x="996" y="115" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Đặt Hàng Ngay</text>

  <!-- Hero Content -->
  <g transform="translate(90, 155)">
    <!-- Main Left Product Banner -->
    <rect x="0" y="0" width="630" height="350" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    
    <rect x="30" y="25" width="150" height="24" rx="4" fill="#dcfce7"/>
    <text x="40" y="41" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">TIÊU CHUẨN VIETGAP</text>

    <text x="30" y="85" font-family="sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Hộp Quà Trái Cây Hữu Cơ Thượng Hạng</text>
    <text x="30" y="115" font-family="sans-serif" font-size="13" fill="#166534">
      Cam kết 100% trái cây sạch tươi ngon thu hoạch trong ngày từ nông trại Đà Lạt.
    </text>

    <!-- Product box illustration -->
    <g transform="translate(30, 135)">
      <rect x="0" y="0" width="280" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="20" y="20" width="240" height="100" rx="6" fill="#fef08a"/>
      <!-- Fruit stylized circles -->
      <circle cx="80" cy="70" r="28" fill="#ef4444"/>
      <circle cx="140" cy="70" r="32" fill="#f97316"/>
      <circle cx="200" cy="70" r="26" fill="#22c55e"/>
      <text x="20" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Hộp Quà Sum Vầy (5 Loại Trái Cây)</text>
      <text x="20" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">580.000 đ <tspan font-size="11" text-decoration="line-through" fill="#94a3b8">750.000 đ</tspan></text>
    </g>

    <!-- Conversion Highlights -->
    <g transform="translate(330, 135)">
      <rect x="0" y="0" width="270" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Ưu Đãi Hôm Nay:</text>
      <text x="16" y="55" font-family="sans-serif" font-size="11" fill="#334155">• Miễn phí giao hàng đơn từ 500k</text>
      <text x="16" y="78" font-family="sans-serif" font-size="11" fill="#334155">• Tặng kèm thiệp chúc mừng thiết kế riêng</text>
      <text x="16" y="101" font-family="sans-serif" font-size="11" fill="#334155">• 1 đổi 1 trong 24h nếu trái cây dập hỏng</text>
      
      <rect x="16" y="125" width="238" height="38" rx="6" fill="#16a34a"/>
      <text x="65" y="149" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">ĐẶT GIAO HỎA TỐC</text>
    </g>

    <!-- Right Side: Real reviews & fast order form -->
    <g transform="translate(660, 0)">
      <rect x="0" y="0" width="380" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Đánh Giá Từ Khách Hàng</text>
      <text x="20" y="60" font-family="sans-serif" font-size="12" fill="#eab308">★★★★★ <tspan fill="#64748b" font-size="11">(4.9/5 từ 420 đơn)</tspan></text>
      <text x="20" y="85" font-family="sans-serif" font-size="11" fill="#334155">"Trái cây rất tươi, đóng gói đẹp mắt đi biếu đối tác ai cũng khen. Giao hàng đúng giờ!"</text>
      <text x="20" y="130" font-family="sans-serif" font-size="11" fill="#64748b">— Chị Mai Lan, Q. Cầu Giấy, Hà Nội</text>

      <rect x="0" y="180" width="380" height="170" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Đặt Mua Nhanh Trong 30 Giây</text>
      <rect x="20" y="225" width="340" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="30" y="243" font-family="sans-serif" font-size="11" fill="#94a3b8">Họ và tên của bạn...</text>
      <rect x="20" y="260" width="340" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="30" y="278" font-family="sans-serif" font-size="11" fill="#94a3b8">Số điện thoại nhận hàng...</text>
      <rect x="20" y="298" width="340" height="35" rx="4" fill="#dc2626"/>
      <text x="110" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Xác Nhận Đặt Mua</text>
    </g>
  </g>
</svg>
