<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Browser Frame -->
  <rect x="60" y="40" width="1080" height="595" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="60" y="40" width="1080" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="85" cy="61" r="5" fill="#f87171"/>
  <circle cx="103" cy="61" r="5" fill="#fbbf24"/>
  <circle cx="121" cy="61" r="5" fill="#34d399"/>
  <rect x="160" y="50" width="480" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="65" font-family="sans-serif" font-size="11" fill="#64748b">https://vieteco-energy.vn — Công Ty Cổ Phần Năng Lượng Xanh Việt Eco</text>

  <!-- Top Corporate Nav -->
  <rect x="60" y="82" width="1080" height="60" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
  <text x="90" y="118" font-family="sans-serif" font-size="20" font-weight="extrabold" fill="#0f766e">VIET ECO <tspan fill="#0f172a">ENERGY</tspan></text>
  <text x="640" y="117" font-family="sans-serif" font-size="13" fill="#334155">Về chúng tôi</text>
  <text x="740" y="117" font-family="sans-serif" font-size="13" fill="#334155">Giải pháp</text>
  <text x="830" y="117" font-family="sans-serif" font-size="13" fill="#334155">Dự án tiêu biểu</text>
  <rect x="950" y="96" width="160" height="32" rx="6" fill="#0f766e"/>
  <text x="972" y="117" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Liên Hệ Hợp Tác B2B</text>

  <!-- Hero Content -->
  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="650" height="340" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
    
    <rect x="30" y="30" width="150" height="24" rx="4" fill="#0f766e"/>
    <text x="42" y="46" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">HỒ SƠ NĂNG LỰC</text>

    <text x="30" y="90" font-family="sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Tiên Phong Giải Pháp Năng Lượng Tái Tạo</text>
    <text x="30" y="125" font-family="sans-serif" font-size="14" fill="#334155" line-height="24">
      Hơn 120MWp dự án điện mặt trời áp mái công nghiệp trên toàn quốc.
    </text>
    <text x="30" y="150" font-family="sans-serif" font-size="14" fill="#334155">
      Đồng hành cùng doanh nghiệp đạt chứng chỉ xanh Net-Zero và xuất khẩu Châu Âu.
    </text>

    <!-- Key Metrics Grid -->
    <g transform="translate(30, 185)">
      <rect x="0" y="0" width="180" height="85" rx="6" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/>
      <text x="16" y="30" font-family="sans-serif" font-size="12" fill="#0f766e">TỔNG CÔNG SUẤT</text>
      <text x="16" y="65" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0f172a">120+ MWp</text>

      <rect x="200" y="0" width="180" height="85" rx="6" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/>
      <text x="16" y="30" font-family="sans-serif" font-size="12" fill="#0f766e">KHÁCH HÀNG DOANH NGHIỆP</text>
      <text x="16" y="65" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0f172a">85+ Tập đoàn</text>

      <rect x="400" y="0" width="180" height="85" rx="6" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/>
      <text x="16" y="30" font-family="sans-serif" font-size="12" fill="#0f766e">GIẢM PHÁT THẢI CO2</text>
      <text x="16" y="65" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0f172a">140.000 tấn</text>
    </g>

    <rect x="30" y="290" width="180" height="32" rx="4" fill="#0f766e"/>
    <text x="48" y="311" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Tải Hồ Sơ Năng Lực (PDF)</text>

    <!-- Right Side: Corporate Certifications & Leadership -->
    <g transform="translate(680, 0)">
      <rect x="0" y="0" width="360" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Chứng Chỉ &amp; Tiêu Chuẩn Quốc Tế</text>
      <text x="20" y="60" font-family="sans-serif" font-size="12" fill="#334155">✓ Chứng nhận ISO 9001:2015 &amp; ISO 14001</text>
      <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#334155">✓ Tiêu chuẩn an toàn điện IEC 62446</text>
      <text x="20" y="110" font-family="sans-serif" font-size="12" fill="#334155">✓ Chứng chỉ xanh EDGE &amp; LEED Gold</text>
      <text x="20" y="135" font-family="sans-serif" font-size="11" fill="#0f766e" font-weight="bold">Xem văn bản pháp lý hợp lệ →</text>

      <rect x="0" y="180" width="360" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Tiếp Nhận Dự Án &amp; Khảo Sát Kỹ Thuật</text>
      <rect x="20" y="225" width="320" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="30" y="244" font-family="sans-serif" font-size="11" fill="#94a3b8">Địa điểm nhà máy hoặc khu công nghiệp...</text>
      <rect x="20" y="265" width="320" height="35" rx="4" fill="#0f172a"/>
      <text x="95" y="287" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Yêu Cầu Khảo Sát Miễn Phí</text>
      <text x="20" y="320" font-family="sans-serif" font-size="10" fill="#64748b">* Kỹ sư khảo sát và hoàn thành báo cáo trong 48 giờ</text>
    </g>
  </g>
</svg>
