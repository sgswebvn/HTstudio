    <text x="20" y="25" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Dashboard Tổng Quan</text>
    
    <!-- MongoDB Atlas Connection Status Badge -->
    <rect x="600" y="5" width="200" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="616" cy="19" r="4" fill="#10b981"/>
    <text x="628" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">MongoDB Atlas: Online</text>

    <!-- Stat Cards Row -->
    <g transform="translate(20, 50)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="180" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="30" font-family="sans-serif" font-size="12" fill="#94a3b8">TỔNG BÀI VIẾT</text>
      <text x="16" y="70" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f8fafc">148</text>

      <!-- Card 2 -->
      <rect x="200" y="0" width="180" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="30" font-family="sans-serif" font-size="12" fill="#94a3b8">ĐÃ XUẤT BẢN</text>
      <text x="16" y="70" font-family="sans-serif" font-size="32" font-weight="bold" fill="#10b981">132</text>

      <!-- Card 3 -->
      <rect x="400" y="0" width="180" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="30" font-family="sans-serif" font-size="12" fill="#94a3b8">BẢN NHÁP</text>
      <text x="16" y="70" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f59e0b">16</text>

      <!-- Card 4 -->
      <rect x="600" y="0" width="180" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="30" font-family="sans-serif" font-size="12" fill="#94a3b8">LƯỢT XEM TỔNG</text>
      <text x="16" y="70" font-family="sans-serif" font-size="32" font-weight="bold" fill="#38bdf8">284K</text>
    </g>

    <!-- Recent Articles Table -->
