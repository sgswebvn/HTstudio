      <text x="24" y="35" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Bài viết cập nhật gần nhất</text>

      <!-- Table Header -->
      <rect x="24" y="55" width="732" height="30" rx="4" fill="#0f172a"/>
      <text x="36" y="75" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">TIÊU ĐỀ BÀI VIẾT</text>
      <text x="400" y="75" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">CHUYÊN MỤC</text>
      <text x="540" y="75" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">TRẠNG THÁI</text>
      <text x="670" y="75" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">THAO TÁC</text>

      <!-- Row 1 -->
      <g transform="translate(24, 95)">
        <text x="12" y="24" font-family="sans-serif" font-size="13" fill="#f8fafc">Hướng dẫn tối ưu hóa bảo mật hệ thống Node.js Express</text>
        <text x="376" y="24" font-family="sans-serif" font-size="12" fill="#38bdf8">Backend</text>
        <rect x="516" y="8" width="80" height="22" rx="4" fill="#064e3b"/>
        <text x="526" y="23" font-family="sans-serif" font-size="11" fill="#34d399">Xuất bản</text>
        <text x="646" y="24" font-family="sans-serif" font-size="12" fill="#38bdf8">Sửa · Xem</text>
      </g>
      <line x1="24" y1="135" x2="756" y2="135" stroke="#334155" stroke-width="1"/>

      <!-- Row 2 -->
      <g transform="translate(24, 145)">
        <text x="12" y="24" font-family="sans-serif" font-size="13" fill="#f8fafc">Chiến lược tích hợp CDN Supabase Storage bucket postnew</text>
        <text x="376" y="24" font-family="sans-serif" font-size="12" fill="#a78bfa">DevOps</text>
        <rect x="516" y="8" width="80" height="22" rx="4" fill="#064e3b"/>
        <text x="526" y="23" font-family="sans-serif" font-size="11" fill="#34d399">Xuất bản</text>
        <text x="646" y="24" font-family="sans-serif" font-size="12" fill="#38bdf8">Sửa · Xem</text>
      </g>
      <line x1="24" y1="185" x2="756" y2="185" stroke="#334155" stroke-width="1"/>

      <!-- Row 3 -->
      <g transform="translate(24, 195)">
        <text x="12" y="24" font-family="sans-serif" font-size="13" fill="#f8fafc">Cơ chế timingSafeEqual triệt tiêu hoàn toàn Time-Attack</text>
        <text x="376" y="24" font-family="sans-serif" font-size="12" fill="#f43f5e">Bảo mật</text>
        <rect x="516" y="8" width="80" height="22" rx="4" fill="#451a03"/>
        <text x="532" y="23" font-family="sans-serif" font-size="11" fill="#fbbf24">Bản nháp</text>
        <text x="646" y="24" font-family="sans-serif" font-size="12" fill="#38bdf8">Sửa · Xem</text>
      </g>
      <line x1="24" y1="235" x2="756" y2="235" stroke="#334155" stroke-width="1"/>

      <!-- Row 4 -->
      <g transform="translate(24, 245)">
        <text x="12" y="24" font-family="sans-serif" font-size="13" fill="#f8fafc">Bộ kiểm thử tự động Media Block Audit &amp; Paste Integrity</text>
        <text x="376" y="24" font-family="sans-serif" font-size="12" fill="#10b981">Testing</text>
        <rect x="516" y="8" width="80" height="22" rx="4" fill="#064e3b"/>
        <text x="526" y="23" font-family="sans-serif" font-size="11" fill="#34d399">Xuất bản</text>
        <text x="646" y="24" font-family="sans-serif" font-size="12" fill="#38bdf8">Sửa · Xem</text>
      </g>
    </g>
