<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#090d16"/>

  <!-- Admin Portal Mockup -->
  <rect x="60" y="40" width="1080" height="595" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Sidebar (Left 220px) -->
  <rect x="60" y="40" width="220" height="595" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="85" y="80" font-family="sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">⚡ BlogWeb CMS</text>
  <text x="85" y="100" font-family="sans-serif" font-size="11" fill="#64748b">ADMINISTRATION PORTAL</text>

  <!-- Sidebar Nav Links -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="180" height="36" rx="6" fill="#1e293b"/>
    <text x="16" y="23" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">📊 Tổng quan (Dashboard)</text>

    <text x="16" y="65" font-family="sans-serif" font-size="13" fill="#94a3b8">📝 Quản lý bài viết</text>
    <text x="16" y="105" font-family="sans-serif" font-size="13" fill="#94a3b8">📁 Chuyên mục</text>
    <text x="16" y="145" font-family="sans-serif" font-size="13" fill="#94a3b8">👥 Nhân sự &amp; Phân quyền</text>
    <text x="16" y="185" font-family="sans-serif" font-size="13" fill="#94a3b8">⚙️ Cấu hình hệ thống</text>
    <text x="16" y="225" font-family="sans-serif" font-size="13" fill="#94a3b8">🧪 Kiểm thử tự động</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(300, 60)">
