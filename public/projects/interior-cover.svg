<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Browser Frame -->
  <rect x="60" y="40" width="1080" height="595" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="60" y="40" width="1080" height="42" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="85" cy="61" r="5" fill="#f87171"/>
  <circle cx="103" cy="61" r="5" fill="#fbbf24"/>
  <circle cx="121" cy="61" r="5" fill="#34d399"/>
  <rect x="160" y="50" width="480" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="65" font-family="sans-serif" font-size="11" fill="#64748b">https://annhieninterior.vn — Thiết Kế &amp; Thi Công Nội Thất Trọn Gói</text>

  <!-- Navigation -->
  <rect x="60" y="82" width="1080" height="60" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
  <text x="90" y="118" font-family="'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#0f172a" letter-spacing="1">AN NHIÊN <tspan font-size="12" font-weight="normal" fill="#64748b">INTERIOR ARCHITECTURE</tspan></text>
  <text x="630" y="117" font-family="sans-serif" font-size="13" fill="#334155">Phong cách</text>
  <text x="730" y="117" font-family="sans-serif" font-size="13" fill="#334155">Công trình bàn giao</text>
  <text x="880" y="117" font-family="sans-serif" font-size="13" fill="#334155">Báo giá 3D</text>
  <rect x="980" y="96" width="130" height="32" rx="6" fill="#0f172a"/>
  <text x="1000" y="117" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Đăng ký tư vấn</text>

  <!-- Hero Content -->
  <g transform="translate(90, 160)">
    <!-- Main Showcase Image -->
    <rect x="0" y="0" width="680" height="340" rx="8" fill="#e2e8f0"/>
    
    <!-- Stylized Modern Interior Space -->
    <rect x="0" y="0" width="680" height="340" rx="8" fill="#f1f5f9"/>
    <!-- Floor line -->
    <path d="M 0,260 L 680,260 L 680,340 L 0,340 Z" fill="#e2e8f0"/>
    <!-- Sofa block -->
    <rect x="140" y="180" width="340" height="80" rx="8" fill="#94a3b8"/>
    <rect x="160" y="160" width="300" height="40" rx="6" fill="#64748b"/>
    <!-- Wall art -->
    <rect x="230" y="40" width="160" height="90" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <!-- Pendant light -->
    <line x1="310" y1="0" x2="310" y2="35" stroke="#475569" stroke-width="2"/>
    <circle cx="310" cy="40" r="10" fill="#f59e0b"/>

    <rect x="25" y="24" width="120" height="26" rx="4" fill="#0f172a"/>
    <text x="35" y="41" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">CÔNG TRÌNH MỚI</text>

    <!-- Overlay Title -->
    <rect x="25" y="235" width="460" height="85" rx="8" fill="#ffffff" opacity="0.95"/>
    <text x="40" y="265" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Biệt Thự Vườn Thảo Điền (380m2)</text>
    <text x="40" y="290" font-family="sans-serif" font-size="12" fill="#475569">Phong cách Hiện Đại Tối Giản • Thi công trọn gói nội thất 4 phòng ngủ</text>
    <text x="40" y="308" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Xem 18 góc ảnh hoàn thiện &amp; bản vẽ →</text>

    <!-- Right Side: Before & After comparison preview -->
    <g transform="translate(710, 0)">
      <rect x="0" y="0" width="330" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Ảnh Trước &amp; Sau Khi Thi Công</text>
      <g transform="translate(20, 42)">
        <rect x="0" y="0" width="140" height="95" rx="4" fill="#f1f5f9"/>
        <text x="30" y="55" font-family="sans-serif" font-size="11" fill="#64748b">Trước (Thô)</text>
        <rect x="150" y="0" width="140" height="95" rx="4" fill="#e0f2fe"/>
        <text x="175" y="55" font-family="sans-serif" font-size="11" fill="#0369a1" font-weight="bold">Sau (Hoàn thiện)</text>
      </g>

      <rect x="0" y="180" width="330" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Bảng Phong Cách Thiết Kế</text>
      <text x="20" y="235" font-family="sans-serif" font-size="12" fill="#334155">• Phong cách Scandinavian (Bắc Âu)</text>
      <text x="20" y="258" font-family="sans-serif" font-size="12" fill="#334155">• Phong cách Indochine (Đông Dương)</text>
      <text x="20" y="281" font-family="sans-serif" font-size="12" fill="#334155">• Phong cách Hiện đại (Modern Luxury)</text>
      <rect x="20" y="300" width="290" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="75" y="318" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="bold">Tải Báo Giá Mẫu Theo Căn Hộ</text>
    </g>
  </g>
</svg>
