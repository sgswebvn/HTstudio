<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="energyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="energyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="energyShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0c4a6e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="1200" height="675" fill="url(#energyBg)"/>
  <circle cx="1080" cy="130" r="280" fill="#0284c7" opacity="0.08" filter="blur(60px)"/>
  <circle cx="140" cy="520" r="240" fill="#10b981" opacity="0.06" filter="blur(50px)"/>

  <!-- Desktop Monitor Frame -->
  <g filter="url(#energyShadow)">
    <rect x="70" y="45" width="1060" height="585" rx="16" fill="#0f172a"/>
    <rect x="76" y="51" width="1048" height="573" rx="12" fill="#ffffff"/>

    <!-- Browser Tab Bar -->
    <rect x="76" y="51" width="1048" height="42" rx="12" fill="#f8fafc"/>
    <circle cx="102" cy="72" r="5.5" fill="#ef4444"/>
    <circle cx="120" cy="72" r="5.5" fill="#f59e0b"/>
    <circle cx="138" cy="72" r="5.5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="180" y="60" width="480" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="200" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#475569">https://vieteco-energy.vn — Giải Pháp Năng Lượng Xanh &amp; Điện Mặt Trời</text>

    <!-- WEBSITE UI INSIDE -->
    <!-- Corporate Header -->
    <rect x="76" y="93" width="1048" height="60" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
    <text x="105" y="130" font-family="sans-serif" font-size="22" font-weight="900" fill="#0369a1">VIET ECO <tspan fill="#10b981">ENERGY</tspan></text>
    
    <text x="540" y="128" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">VỀ CHÚNG TÔI</text>
    <text x="660" y="128" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">DỰ ÁN EPC</text>
    <text x="765" y="128" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">TIÊU CHUẨN ESG</text>

    <rect x="940" y="106" width="155" height="34" rx="8" fill="#2563eb"/>
    <text x="965" y="128" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">LIÊN HỆ HỢP TÁC</text>

    <!-- Main Content -->
    <g transform="translate(105, 175)">
      <!-- Left Hero Banner: Solar & Wind Tech -->
      <rect x="0" y="0" width="620" height="420" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      
      <!-- Visual Illustration of Solar Park & Smart Grid -->
      <rect x="20" y="20" width="580" height="220" rx="8" fill="#0284c7"/>
      <!-- Solar grid perspective polygons -->
      <polygon points="40,200 160,110 320,110 260,200" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
      <polygon points="280,200 340,110 500,110 460,200" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="480" cy="70" r="30" fill="#fef08a" opacity="0.9"/>
      <!-- Wind turbines -->
      <line x1="100" y1="120" x2="100" y2="60" stroke="#ffffff" stroke-width="2"/>
      <line x1="200" y1="110" x2="200" y2="40" stroke="#ffffff" stroke-width="2"/>

      <rect x="35" y="35" width="180" height="24" rx="4" fill="#ffffff" opacity="0.95"/>
      <text x="45" y="51" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1">TIÊU CHUẨN XANH QUỐC TẾ</text>

      <text x="25" y="275" font-family="sans-serif" font-size="23" font-weight="extrabold" fill="#0f172a">Tiên Phong Giải Pháp Điện Mặt Trời Mái Nhà Công Nghiệp</text>
      <text x="25" y="305" font-family="sans-serif" font-size="12" fill="#0369a1">
        Tổng thầu EPC trọn gói: Thiết kế, cung ứng thiết bị và thi công vận hành hệ thống năng lượng tái tạo cho các nhà máy, khu công nghiệp.
      </text>

      <!-- Key Metrics Strip -->
      <g transform="translate(25, 335)">
        <rect x="0" y="0" width="170" height="60" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
        <text x="15" y="26" font-family="sans-serif" font-size="18" font-weight="900" fill="#0284c7">50+ MWp</text>
        <text x="15" y="46" font-family="sans-serif" font-size="10" fill="#64748b">Tổng công suất lắp đặt</text>

        <rect x="185" y="0" width="170" height="60" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
        <text x="200" y="26" font-family="sans-serif" font-size="18" font-weight="900" fill="#10b981">120+ Dự án</text>
        <text x="200" y="46" font-family="sans-serif" font-size="10" fill="#64748b">Doanh nghiệp FDI tin cậy</text>

        <rect x="370" y="0" width="190" height="60" rx="8" fill="#2563eb"/>
        <text x="390" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">NHẬN HỒ SƠ NĂNG LỰC →</text>
      </g>

      <!-- Right Column: Corporate Highlights & Case Studies -->
      <g transform="translate(645, 0)">
        <!-- Highlight 1 -->
        <rect x="0" y="0" width="345" height="130" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="20" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1">DỰ ÁN TIÊU BIỂU: NHÀ MÁY VSIP</text>
        <text x="20" y="55" font-family="sans-serif" font-size="11" fill="#334155">• Công suất: 4.8 MWp hệ thống áp mái</text>
        <text x="20" y="75" font-family="sans-serif" font-size="11" fill="#334155">• Giảm 5.200 tấn CO2 phát thải mỗi năm</text>
        <text x="20" y="98" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981">✓ Đã nghiệm thu &amp; phát điện hòa lưới</text>

        <!-- Highlight 2 -->
        <g transform="translate(0, 145)">
          <rect x="0" y="0" width="345" height="130" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="20" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1">CAM KẾT CHẤT LƯỢNG VẬN HÀNH</text>
          <text x="20" y="55" font-family="sans-serif" font-size="11" fill="#334155">• Tấm pin Tier 1 bảo hành hiệu suất 25 năm</text>
          <text x="20" y="75" font-family="sans-serif" font-size="11" fill="#334155">• Hệ thống giám sát SCADA theo thời gian thực</text>
          <text x="20" y="98" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">✓ Đội ngũ kỹ sư hỗ trợ kỹ thuật 24/7</text>
        </g>

        <!-- ESG Certified -->
        <g transform="translate(0, 290)">
          <rect x="0" y="0" width="345" height="130" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
          <text x="20" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">CHỨNG CHỈ NĂNG LƯỢNG TÁI TẠO (I-REC)</text>
          <text x="20" y="58" font-family="sans-serif" font-size="11" fill="#166534">Hỗ trợ các doanh nghiệp đạt chứng chỉ xanh phục vụ xuất khẩu hàng hóa sang thị trường EU và Mỹ.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
