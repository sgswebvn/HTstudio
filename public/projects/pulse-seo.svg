<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#0b1329"/>
  <!-- Title -->
  <text x="80" y="80" font-family="sans-serif" font-size="28" font-weight="bold" fill="#38bdf8">PULSE Entertainment — SEO &amp; Schema Architecture</text>
  <text x="80" y="115" font-family="sans-serif" font-size="16" fill="#94a3b8">Hệ thống tối ưu hóa Google Search, Google Discover và mạng xã hội</text>

  <!-- Diagram boxes -->
  <g transform="translate(80, 160)">
    <!-- Box 1: Clean URL -->
    <rect x="0" y="0" width="320" height="200" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="24" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">1. Clean URL Structure</text>
    <text x="24" y="80" font-family="monospace" font-size="14" fill="#a5f3fc">/[category]/[slug]</text>
    <text x="24" y="120" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Tối ưu độ sâu thư mục (Depth &lt;= 2)</text>
    <text x="24" y="145" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Slug chuẩn hóa không ký tự thừa</text>
    <text x="24" y="170" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Canonical URL tự động</text>

    <!-- Box 2: JSON-LD -->
    <rect x="360" y="0" width="320" height="200" rx="8" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
    <text x="384" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2dd4bf">2. JSON-LD Structured Data</text>
    <text x="384" y="80" font-family="monospace" font-size="13" fill="#99f6e4">Schema: NewsArticle, Organization</text>
    <text x="384" y="120" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Author E-E-A-T credentials</text>
    <text x="384" y="145" font-family="sans-serif" font-size="13" fill="#cbd5e1">• DatePublished &amp; DateModified ISO</text>
    <text x="384" y="170" font-family="sans-serif" font-size="13" fill="#cbd5e1">• BreadcrumbList phân cấp mục</text>

    <!-- Box 3: Dynamic Feeds -->
    <rect x="720" y="0" width="320" height="200" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="744" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#a78bfa">3. Dynamic Feeds &amp; Bots</text>
    <text x="744" y="80" font-family="monospace" font-size="13" fill="#ddd6fe">/sitemap.xml &amp; /robots.txt</text>
    <text x="744" y="120" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Cập nhật tức thì khi có bài mới</text>
    <text x="744" y="145" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Phân loại changefreq và priority</text>
    <text x="744" y="170" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Chỉ dẫn Googlebot và Bingbot chuẩn</text>
  </g>

  <!-- Lower summary panel -->
  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="1040" height="200" rx="12" fill="#131c31" stroke="#223354" stroke-width="1"/>
    <text x="30" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">Kết quả Tối ưu Core Web Vitals &amp; Discover</text>
    
    <g transform="translate(40, 75)">
      <rect x="0" y="0" width="220" height="90" rx="6" fill="#0f172a"/>
      <text x="20" y="35" font-family="sans-serif" font-size="14" fill="#94a3b8">Lighthouse SEO</text>
      <text x="20" y="70" font-family="sans-serif" font-size="28" font-weight="bold" fill="#10b981">100 / 100</text>

      <rect x="250" y="0" width="220" height="90" rx="6" fill="#0f172a"/>
      <text x="20" y="35" font-family="sans-serif" font-size="14" fill="#94a3b8">Cumulative Layout Shift</text>
      <text x="20" y="70" font-family="sans-serif" font-size="28" font-weight="bold" fill="#10b981">0.00 (Zero CLS)</text>

      <rect x="500" y="0" width="220" height="90" rx="6" fill="#0f172a"/>
      <text x="20" y="35" font-family="sans-serif" font-size="14" fill="#94a3b8">Largest Contentful Paint</text>
      <text x="20" y="70" font-family="sans-serif" font-size="28" font-weight="bold" fill="#10b981">1.2s (Fast)</text>

      <rect x="750" y="0" width="220" height="90" rx="6" fill="#0f172a"/>
      <text x="20" y="35" font-family="sans-serif" font-size="14" fill="#94a3b8">AdSense Eligibility</text>
      <text x="20" y="70" font-family="sans-serif" font-size="28" font-weight="bold" fill="#38bdf8">100% Ready</text>
    </g>
  </g>
</svg>
