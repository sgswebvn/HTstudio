    <text x="36" y="400" font-family="monospace" font-size="11" fill="#94a3b8">```javascript</text>
    <text x="36" y="420" font-family="monospace" font-size="11" fill="#38bdf8">const isMatch = timingSafeEqual(storedHash, computedHash);</text>
