<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#090d16"/>
  
  <text x="80" y="70" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2dd4bf">ProductHub — Modular Monolith Architecture</text>
  <text x="80" y="105" font-family="sans-serif" font-size="15" fill="#94a3b8">Hệ thống quản lý dữ liệu sản phẩm trung tâm (PIM) 5 tầng phân lập trên Next.js 15 App Router</text>

  <!-- 5 Layers Diagram -->
  <g transform="translate(80, 140)">
    <!-- Layer 1: Presentation & API Routes -->
    <rect x="0" y="0" width="1040" height="70" rx="8" fill="#132738" stroke="#0284c7" stroke-width="2"/>
    <text x="24" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">1. PRESENTATION &amp; INTEGRATION LAYER</text>
    <text x="24" y="54" font-family="monospace" font-size="12" fill="#bae6fd">Admin UI (React Server Components / Client Components)  |  REST API Routes (/api/v1/*)</text>

    <!-- Arrow Down -->
    <text x="520" y="90" font-family="sans-serif" font-size="16" fill="#64748b" text-anchor="middle">▼</text>

    <!-- Layer 2: Application Layer -->
    <rect x="0" y="100" width="1040" height="70" rx="8" fill="#142c2e" stroke="#0d9488" stroke-width="2"/>
    <text x="24" y="132" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2dd4bf">2. APPLICATION LAYER</text>
    <text x="24" y="154" font-family="monospace" font-size="12" fill="#99f6e4">Use Cases, Command Handlers &amp; Service Classes (src/modules/*/services/*)</text>

    <!-- Arrow Down -->
    <text x="520" y="190" font-family="sans-serif" font-size="16" fill="#64748b" text-anchor="middle">▼</text>

    <!-- Layer 3: Domain Layer -->
    <rect x="0" y="200" width="1040" height="70" rx="8" fill="#221b38" stroke="#7c3aed" stroke-width="2"/>
    <text x="24" y="232" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">3. DOMAIN LAYER (Single Source of Truth)</text>
    <text x="24" y="254" font-family="monospace" font-size="12" fill="#ddd6fe">Entities, Value Objects, Domain Rules, Interfaces &amp; Dynamic Attributes</text>

    <!-- Arrow Down -->
    <text x="520" y="290" font-family="sans-serif" font-size="16" fill="#64748b" text-anchor="middle">▼</text>

    <!-- Layer 4: Infrastructure Layer -->
    <rect x="0" y="300" width="1040" height="70" rx="8" fill="#2a1f18" stroke="#d97706" stroke-width="2"/>
    <text x="24" y="332" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fbbf24">4. INFRASTRUCTURE LAYER</text>
    <text x="24" y="354" font-family="monospace" font-size="12" fill="#fde68a">MongoDB Atlas (Mongoose Connection Caching), Vercel Blob Adapter, NextAuth v5</text>

    <!-- Key Architecture Benefits -->
    <g transform="translate(0, 395)">
      <rect x="0" y="0" width="330" height="80" rx="6" fill="#1e293b"/>
      <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2dd4bf">Cold Start Mitigation</text>
      <text x="20" y="55" font-family="sans-serif" font-size="11" fill="#94a3b8">Tái sử dụng mongoose connection pool</text>

      <rect x="355" y="0" width="330" height="80" rx="6" fill="#1e293b"/>
      <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Strict Zod Validation</text>
      <text x="20" y="55" font-family="sans-serif" font-size="11" fill="#94a3b8">Bảo vệ kiểu dữ liệu từ request đến domain</text>

      <rect x="710" y="0" width="330" height="80" rx="6" fill="#1e293b"/>
      <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a78bfa">Modular Extensibility</text>
      <text x="20" y="55" font-family="sans-serif" font-size="11" fill="#94a3b8">Bật/tắt module không gây downtime</text>
    </g>
  </g>
</svg>
